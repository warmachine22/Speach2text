name: Windows portable build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted
          Copy-Item (Get-ChildItem ffmpeg-extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName vendor/ffmpeg/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-extracted -Filter ffprobe.exe -Recurse | Select-Object -First 1).FullName vendor/ffmpeg/ffprobe.exe
      - run: npm install
      - run: npm run check
      - run: npm run dist
      - name: Prepare clean portable app folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force PortableApp | Out-Null
          Copy-Item (Get-ChildItem release -Filter '*.exe' | Select-Object -First 1).FullName PortableApp/PortableScribe.exe
          Set-Content PortableApp/START-HERE.txt 'Double-click PortableScribe.exe. Enter your own OpenAI API key. Do not share AppData because it contains your saved API key.'
      - uses: actions/upload-artifact@v4
        with:
          name: PortableApp-Windows
          path: PortableApp/
